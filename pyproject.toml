[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-document-processing-pipeline"
version = "2.0.0"
description = "Receipt and form data extraction with a fine-tuned Qwen2.5-VL vision-language model: OCR-free, calibrated confidence scores, document-type routing and a human-in-the-loop review queue"
keywords = ["document-ai", "receipt-ocr", "data-extraction", "vision-language-model", "qwen2-vl", "lora", "fine-tuning", "confidence-calibration", "human-in-the-loop", "sroie", "cord", "xfund", "rvl-cdip", "fastapi", "modal"]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["B008", "E501"]   # B008: FastAPI File(...) default is the documented idiom; E501: the formatter wraps code, long strings stay

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]                   # tests put the repository root on sys.path before importing src
"benchmarks/*" = ["E402"]
"scripts/*" = ["E402"]
"app.py" = ["E402"]
